name: Deploy Review Site

on:
  workflow_dispatch:
    inputs:
      site_ref:
        description: Git ref containing the complete static Pages site
        required: true
      site_path:
        description: Path inside site_ref to deploy
        required: false
        default: .

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.site_ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.site_path }}
      - id: deployment
        uses: actions/deploy-pages@v4
