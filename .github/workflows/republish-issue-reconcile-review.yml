name: Republish Issue Reconcile Review

# Repairs and redeploys a published issue-reconcile review entirely from data
# already on GitHub. The original local run inputs (autofhir/runs/<id>/) are not
# committed, but the published report under the pages-<run-id> branch already
# contains every issue and commit SHA, and those commits are reachable in this
# repo (the orphan source branch <run-id> has them). This backfills the GitHub
# link fields the review app reads, rebuilds the review app bundle
# (review-app.js/review-app.css) from the current web/review-app source so UI
# changes ship without re-running the data pipeline, then deploys the fixed
# per-run site to Pages.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id (also the orphan source branch name)
        required: true
        default: issue-reconcile-full-clean-balanced-v2
      github_repo:
        description: OWNER/REPO that hosts the branches and commits
        required: false
        default: jmandel/autofhir
      pages_base_url:
        description: Base URL of the deployed Pages site
        required: false
        default: https://joshuamandel.com/autofhir/
      deploy:
        description: Deploy the repaired site to GitHub Pages
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Check out published artifacts branch
        uses: actions/checkout@v4
        with:
          ref: pages-${{ inputs.run_id }}
          path: site

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Backfill GitHub link fields in the published report
        run: |
          bun scripts/backfill-issue-reconcile-report-links.ts \
            --report "site/${{ inputs.run_id }}/issue-reconcile-report.json" \
            --run-id "${{ inputs.run_id }}" \
            --github-repo "${{ inputs.github_repo }}" \
            --pages-base-url "${{ inputs.pages_base_url }}"

      - name: Rebuild review app bundle from current source
        run: |
          bun build web/review-app/src/main.tsx \
            --target=browser \
            --production \
            --outfile "site/${{ inputs.run_id }}/review-app.js"
          cp web/review-app/src/styles.css "site/${{ inputs.run_id }}/review-app.css"

      - name: Commit and push repaired artifacts
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.run_id }}/issue-reconcile-report.json" "${{ inputs.run_id }}/issue-reconcile-report.json.gz" \
            "${{ inputs.run_id }}/review-app.js" "${{ inputs.run_id }}/review-app.css"
          if git diff --cached --quiet; then
            echo "No artifact changes to commit; report links and review app bundle were already up to date."
          else
            git commit -m "Backfill GitHub links and rebuild review app for ${{ inputs.run_id }}"
            git push origin "HEAD:refs/heads/pages-${{ inputs.run_id }}"
          fi

      - name: Assemble Pages publish directory
        if: ${{ inputs.deploy }}
        run: |
          rm -rf publish
          mkdir -p publish
          cp -r "site/${{ inputs.run_id }}" "publish/${{ inputs.run_id }}"
          rm -rf "publish/${{ inputs.run_id }}/.git"
          touch publish/.nojekyll
          cat > publish/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>AutoFHIR Review Apps</title>
          <meta http-equiv="refresh" content="0; url=${{ inputs.run_id }}/">
          <h1>AutoFHIR Review Apps</h1>
          <ul><li><a href="${{ inputs.run_id }}/">${{ inputs.run_id }}</a></li></ul>
          EOF

      - uses: actions/configure-pages@v5
        if: ${{ inputs.deploy }}

      - uses: actions/upload-pages-artifact@v4
        if: ${{ inputs.deploy }}
        with:
          path: publish

      - id: deployment
        if: ${{ inputs.deploy }}
        uses: actions/deploy-pages@v4
